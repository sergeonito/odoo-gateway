[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
# Overridden by GATEWAY_DATABASE_URL (see migrations/env.py).
sqlalchemy.url = postgresql+asyncpg://gateway:gateway@localhost:5433/gateway

# New migrations are generated from the models (`make migration MSG="..."`), formatted by ruff
# and then reviewed by hand: autogenerate does not see triggers, renames or data moves.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
