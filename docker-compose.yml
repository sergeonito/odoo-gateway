# Local stack: Odoo 18 (+ its PostgreSQL), the gateway (+ its PostgreSQL for audit and snapshots),
# Redis with a Celery worker and beat for the scheduled stock snapshot.
# Credentials here are for a laptop only.
services:
  odoo-db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 20

  # One-shot: create the `odoo` database with stock + contacts, then exit.
  odoo-init:
    image: odoo:18
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    command: ["odoo", "-d", "odoo", "-i", "stock,contacts", "--stop-after-init"]
    volumes:
      - odoo-data:/var/lib/odoo
    restart: "no"

  odoo:
    image: odoo:18
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    command: ["odoo", "-d", "odoo", "--db-filter=^odoo$$"]
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo

  gateway-db:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5433:5432"
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      retries: 20

  gateway:
    build: .
    env_file: .env
    environment:
      GATEWAY_ODOO_URL: http://odoo:8069
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway@gateway-db:5432/gateway
    depends_on:
      gateway-db:
        condition: service_healthy
      odoo:
        condition: service_started
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # for `make worker` on the host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Same image as the gateway; the worker runs tasks, beat only enqueues them on schedule.
  worker:
    build: .
    env_file: .env
    environment:
      GATEWAY_ODOO_URL: http://odoo:8069
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway@gateway-db:5432/gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "odoo_gateway.worker", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_started  # the gateway runs the migrations

  beat:
    build: .
    env_file: .env
    environment:
      GATEWAY_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "odoo_gateway.worker", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  odoo-db:
  odoo-data:
  gateway-db:
